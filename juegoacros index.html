    <!-- LÓGICA DE AUDIO (Música Generativa & SFX) -->
    <!-- ------------------------------------------------------------------ -->
    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let isMuted = false;
        let isMusicPlaying = false;
        let musicInterval;
        let noteIndex = 0;

        // Melodía "8-bit Hero"
        const melody = [
            261.63, 329.63, 392.00, 523.25, 392.00, 329.63, // C
            293.66, 349.23, 440.00, 587.33, 440.00, 349.23  // D
        ];

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startMusic() {
            if (!audioCtx) initAudio();
            if (isMusicPlaying || isMuted) return;
            
            isMusicPlaying = true;
            musicInterval = setInterval(() => {
                if(!isMuted && isMusicPlaying) {
                    const freq = melody[noteIndex % melody.length];
                    playTone(freq, 'square', 0.15, 0.03); 
                    noteIndex++;
                }
            }, 200);
        }

        function stopMusic() {
            isMusicPlaying = false;
            clearInterval(musicInterval);
        }

        function toggleAudio() {
            isMuted = !isMuted;
            const btn = document.getElementById('audio-btn');
            
            if(isMuted) {
                btn.innerHTML = '<i class="fas fa-volume-mute text-red-400"></i> SONIDO: OFF';
                stopMusic();
            } else {
                btn.innerHTML = '<i class="fas fa-volume-up text-green-400"></i> SONIDO: ON';
                if (!document.getElementById('game-screen').classList.contains('hidden')) {
                    startMusic();
                }
            }
        }

        function sfxSelect() { playTone(440, 'triangle', 0.1, 0.1); }
        function sfxCorrect() { 
            playTone(880, 'square', 0.1, 0.1); 
            setTimeout(() => playTone(1760, 'square', 0.2, 0.1), 100); 
        }
        function sfxWrong() { playTone(150, 'sawtooth', 0.3, 0.2); }
        function sfxWin() {
            stopMusic(); 
            [523, 659, 783, 1046, 783, 1046].forEach((f, i) => {
                setTimeout(() => playTone(f, 'square', 0.3, 0.2), i * 150);
            });
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCnVM-XX6hjP4TA9hW0BdiYZaNx64XybMk",
            authDomain: "retoeducativo-14ef9.firebaseapp.com",
            projectId: "retoeducativo-14ef9",
            storageBucket: "retoeducativo-14ef9.firebasestorage.app",
            messagingSenderId: "618889780802",
            appId: "1:618889780802:web:a9811f95c66645282517db"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            const statusBadge = document.getElementById('server-status');
            statusBadge.innerHTML = '<i class="fas fa-wifi text-green-500"></i> SERVIDOR CONECTADO';
            statusBadge.classList.add('text-green-700', 'bg-green-50');
            window.dbConnected = true;
        } catch (e) {
            console.error("Error conectando Firebase:", e);
        }

        window.saveScoreToCloud = async (name, score) => {
            if (!window.dbConnected) return;
            try {
                await addDoc(collection(db, "puntajes"), { name: name, score: score, timestamp: new Date() });
            } catch (e) { console.error("Error guardando score: ", e); }
        };

        window.listenToLeaderboard = () => {
            if (!window.dbConnected) {
                document.getElementById('loading-leaderboard').innerHTML = "<p class='text-red-500 text-[8px]'>⚠ Modo Local</p>";
                return;
            }
            const q = query(collection(db, "puntajes"), orderBy("score", "desc"), limit(50));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('leaderboard-list');
                const loader = document.getElementById('loading-leaderboard');
                if(loader) loader.style.display = 'none';
                list.innerHTML = "";
                let rank = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const row = document.createElement('div');
                    row.className = "flex justify-between items-center border-b border-blue-200 pb-1";
                    let color = "text-gray-600";
                    let icon = "";
                    if(rank === 1) { color = "text-yellow-600 font-bold"; icon = "👑"; }
                    else if(rank === 2) { color = "text-gray-500 font-bold"; icon = "🥈"; }
                    else if(rank === 3) { color = "text-orange-600 font-bold"; icon = "🥉"; }
                    let bg = "";
                    if(data.name === window.currentPlayerName && data.score === window.currentScore) {
                        bg = "bg-yellow-100 px-1 rounded border border-yellow-300 animate-pulse";
                    }
                    row.innerHTML = `<span class="${color} ${bg}">${rank}. ${icon} ${data.name}</span><span class="${color}">${data.score}</span>`;
                    list.appendChild(row);
                    rank++;
                });
            });
        };
    </script>

            { a: "UNESCO", c: "Org. de las Naciones Unidas para la Edu., Ciencia y Cultura", w: ["Unión Nacional de Escuelas para la Ciencia", "Unidad Especial de Cultura y Organización"], t: 10, phase: "Internacional" },
            { a: "OCDE", c: "Org. para la Cooperación y el Desarrollo Econ.", w: ["Oficina de Control de Desarrollo Educativo", "Orden de Calidad para el Desarrollo Estudiantil"], t: 10, phase: "Internacional" },
            { a: "PISA", c: "Programa para la Eval. Internacional de Alumnos", w: ["Plan Internacional de Seguridad Académica", "Proyecto Integral de Saberes y Aprendizajes"], t: 10, phase: "Internacional" },
            { a: "IEA", c: "Asociación Int. de Evaluación del Rendimiento", w: ["Instituto de Enseñanza Aplicada", "Agencia Internacional de Educación"], t: 10, phase: "Internacional" },
            { a: "USICAMM", c: "Unidad del Sist. para la Carrera de las Maestras y Maestros", w: ["Unión de Sistemas de Capacitación", "Unidad de Servicios de Inteligencia Educativa"], t: 8, phase: "Gestión" },
            { a: "PDA", c: "Proceso de Desarrollo del Aprendizaje", w: ["Plan de Desarrollo Académico", "Programa de Docentes en Acción"], t: 8, phase: "Gestión" },
            { a: "ATP", c: "Asesores Técnicos Pedagógicos", w: ["Asociación de Técnicos y Profesores", "Apoyo Técnico Profesional"], t: 8, phase: "Gestión" },
            { a: "AEF", c: "Autoridad Educativa Federal", w: ["Alianza de Escuelas Federales", "Academia de Educación y Formación"], t: 8, phase: "Gestión" },
            { a: "PNEE", c: "Política Nacional de Evaluación Educativa", w: ["Programa Nacional de Escuelas de Excelencia", "Plan Nacional de Educación Especial"], t: 8, phase: "Gestión" },
            { a: "AEE", c: "Áreas Estatales de Evaluación", w: ["Asociación de Estudiantes de Educación", "Alianza de Evaluación Externa"], t: 7, phase: "Técnico" },
            { a: "DGE", c: "Dirección General de Evaluación", w: ["Dirección de Gestión Educativa", "Departamento de Grados Escolares"], t: 7, phase: "Técnico" },
            { a: "DGEP", c: "Dirección Gral. de Evaluación de Políticas", w: ["Dirección de Gestión de Escuelas Públicas", "Departamento General de Educación Particular"], t: 7, phase: "Técnico" },
            { a: "OAE", c: "Organismos de Apoyo a la Evaluación", w: ["Oficinas de Atención Escolar", "Ordenanza de Aprendizaje y Enseñanza"], t: 7, phase: "Técnico" }
        ];

        let state = { idx: 0, score: 0, timer: null, canClick: false, questions: [] };
        window.currentPlayerName = "";
        window.currentScore = 0;

        function shareGame() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                const msg = document.getElementById('share-msg');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
            });
        }

        function startGame() {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim().toUpperCase();
            if(!name) { 
                nameInput.classList.add('border-red-500', 'bg-red-50');
                setTimeout(() => nameInput.classList.remove('border-red-500', 'bg-red-50'), 1000);
                return; 
            }
            
            initAudio(); 
            sfxSelect();
            if(!isMuted) startMusic(); 

            window.currentPlayerName = name;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            state.questions = [...database].sort(() => Math.random() - 0.5);
            state.idx = 0; state.score = 0;
            updateScoreUI();
            loadQuestion();
        }

        function loadQuestion() {
            if(state.idx >= state.questions.length) { endGame(); return; }
            
            const q = state.questions[state.idx];
            state.canClick = true;
            
            document.getElementById('progress-display').innerText = `${state.idx + 1}/${state.questions.length}`;
            document.getElementById('acronym-text').innerText = q.a;

            const opts = document.getElementById('options-container');
            opts.innerHTML = '';
            
            let choices = [{t: q.c, ok: true}, ...q.w.map(x => ({t: x, ok: false}))].sort(() => Math.random() - 0.5);

            choices.forEach(c => {
                const btn = document.createElement('button');
                // Clase responsiva: p-4 en móvil, p-6 en PC. justify-center para centrar texto verticalmente si es largo
                btn.className = "w-full p-4 md:p-6 text-left bg-gray-100 hover:bg-white text-[10px] md:text-xs pixel-btn relative group transition-colors flex flex-col justify-center h-full";
                btn.innerHTML = `<div class="flex items-start gap-2"><span class="text-gray-400 group-hover:text-black mt-1">></span> <span class="leading-relaxed">${c.t}</span></div>`;
                btn.onclick = () => check(btn, c.ok);
                opts.appendChild(btn);
            });

            startTimer(q.t);
        }

        function startTimer(sec) {
            clearInterval(state.timer);
            const bar = document.getElementById('timer-bar');
            bar.style.transition = 'none'; bar.style.width = '100%';
            void bar.offsetWidth; 
            bar.style.transition = `width ${sec}s linear`;
            bar.style.width = '0%';
            state.timer = setTimeout(() => timeUp(), sec * 1000);
        }

        function check(btn, ok) {
            if(!state.canClick) return;
            state.canClick = false; clearInterval(state.timer);

            const bar = document.getElementById('timer-bar');
            const percentageLeft = (bar.offsetWidth / bar.parentElement.offsetWidth);

            if(ok) {
                sfxCorrect();
                btn.classList.add('bg-green-500', 'text-white', 'border-green-800');
                const timeBonus = Math.round(percentageLeft * 50); 
                state.score += (100 + timeBonus);
            } else {
                sfxWrong();
                btn.classList.add('bg-red-500', 'text-white', 'border-red-800');
                btn.style.transform = "translateX(5px)";
                setTimeout(()=> btn.style.transform = "translateX(-5px)", 50);
                setTimeout(()=> btn.style.transform = "translateX(0px)", 100);
            }
            updateScoreUI();
            setTimeout(() => { state.idx++; loadQuestion(); }, 1200);
        }

        function timeUp() {
            if(!state.canClick) return;
            state.canClick = false;
            sfxWrong();
            const currentQ = state.questions[state.idx];
            document.querySelectorAll('#options-container button').forEach(b => {
                if(b.innerText.includes(currentQ.c)) b.classList.add('bg-green-500', 'text-white');
            });
            setTimeout(() => { state.idx++; loadQuestion(); }, 1500);
        }

        function updateScoreUI() {
            document.getElementById('score-display').innerText = state.score.toString().padStart(5, '0');
        }

        function endGame() {
            sfxWin();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = state.score;
            
            window.currentScore = state.score;

            if(window.saveScoreToCloud) {
                window.saveScoreToCloud(window.currentPlayerName, state.score);
            }
            if(window.listenToLeaderboard) {
                window.listenToLeaderboard();
            }
        }
    </script>
</body>

</html>
